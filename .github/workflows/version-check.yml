name: Version Check

on:
  pull_request:
    branches:
      - main

jobs:
  check-version-bump:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for version bump in src/version.php
        run: |
          BASE_REF="${{ github.event.pull_request.base.sha }}"
          HEAD_REF="${{ github.event.pull_request.head.sha }}"

          if git diff --name-only "$BASE_REF" "$HEAD_REF" | grep -q '^src/version.php$'; then
            echo "src/version.php was modified — version bump detected"
          else
            echo "::error::src/version.php was NOT modified in this PR."
            echo ""
            echo "Every merge to main triggers a release. Please bump the version"
            echo "in src/version.php before merging."
            echo ""
            echo "Update these fields as needed:"
            echo '  $plugin->version  (YYYYMMDDHH format)'
            echo '  $plugin->release  (semver string)'
            echo '  $plugin->maturity (MATURITY_ALPHA|BETA|RC|STABLE)'
            exit 1
          fi

  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan source tree for secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --no-git --redact --config /repo/.gitleaks.toml
