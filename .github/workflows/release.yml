name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Extract version from src/version.php
        id: version
        run: |
          VERSION=$(grep -oP "\\\$plugin->release\s*=\s*'\K[^']+" src/version.php)
          MOODLE_VERSION=$(grep -oP "\\\$plugin->version\s*=\s*\K[0-9]+" src/version.php)
          {
            echo "release=$VERSION"
            echo "moodle_version=$MOODLE_VERSION"
            echo "tag=v$MOODLE_VERSION"
            if echo "$VERSION" | grep -qiE -- '-(alpha|beta|rc)(\.?[0-9]+)?$'; then
              echo "prerelease=true"
            else
              echo "prerelease=false"
            fi
          } >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION (Moodle version: $MOODLE_VERSION)"

      - name: Check if tag or release already exists
        id: check_release
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          SHA="${{ github.sha }}"

          # Commit the remote tag points at (peeled for annotated tags), empty when absent.
          TAG_COMMIT=""
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            REFS=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
            TAG_COMMIT=$(echo "$REFS" | awk '$2 ~ /\^\{\}$/ {print $1}')
            if [ -z "$TAG_COMMIT" ]; then
              TAG_COMMIT=$(echo "$REFS" | awk '{print $1; exit}')
            fi
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ -n "$TAG_COMMIT" ] && [ "$TAG_COMMIT" = "$SHA" ]; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "reuse_tag=true" >> "$GITHUB_OUTPUT"
              echo "Release $TAG already exists for $SHA (re-run), skipping."
              exit 0
            fi
            echo "::error::Release $TAG already exists for commit ${TAG_COMMIT:-<no tag>}, not $SHA. Bump \$plugin->version in src/version.php."
            exit 1
          fi

          echo "exists=false" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG_COMMIT" ]; then
            if [ "$TAG_COMMIT" != "$SHA" ]; then
              echo "::error::Tag $TAG already exists on commit $TAG_COMMIT, not $SHA, and has no release. Bump \$plugin->version in src/version.php, or delete the stray tag."
              exit 1
            fi
            echo "reuse_tag=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already points at $SHA with no release (earlier run failed after tagging): reusing it."
          else
            echo "reuse_tag=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG does not exist, will create..."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build plugin
        if: steps.check_release.outputs.exists == 'false'
        run: |
          npm ci
          npm run build

      - name: Verify build version consistency
        if: steps.check_release.outputs.exists == 'false'
        run: |
          echo "=== Verifying version consistency ==="

          SRC_RELEASE=$(grep -oP "\\\$plugin->release\s*=\s*'\K[^']+" src/version.php)
          DIST_RELEASE=$(grep -oP "\\\$plugin->release\s*=\s*'\K[^']+" dist/version.php)
          SRC_VERSION=$(grep -oP "\\\$plugin->version\s*=\s*\K[0-9]+" src/version.php)
          DIST_VERSION=$(grep -oP "\\\$plugin->version\s*=\s*\K[0-9]+" dist/version.php)

          echo "src/version.php  → release=$SRC_RELEASE, version=$SRC_VERSION"
          echo "dist/version.php → release=$DIST_RELEASE, version=$DIST_VERSION"

          if [ "$SRC_RELEASE" != "$DIST_RELEASE" ]; then
            echo "::error::Release mismatch! src=$SRC_RELEASE dist=$DIST_RELEASE"
            exit 1
          fi

          if [ "$SRC_VERSION" != "$DIST_VERSION" ]; then
            echo "::error::Version mismatch! src=$SRC_VERSION dist=$DIST_VERSION"
            exit 1
          fi

          # Validate maturity consistency
          SRC_MATURITY=$(grep -oP "\\\$plugin->maturity\s*=\s*\KMATURITY_\w+" src/version.php)
          echo "Maturity: $SRC_MATURITY, Release: $SRC_RELEASE"

          # Pre-release suffix: -alpha, -beta or -rc, optionally followed by a number (-rc1, -beta.2).
          SUFFIX=$(echo "$SRC_RELEASE" | grep -oiE -- '-(alpha|beta|rc)(\.?[0-9]+)?$' | sed -E 's/^-([A-Za-z]+).*/\1/' | tr '[:lower:]' '[:upper:]' || true)
          if [ -n "$SUFFIX" ]; then
            EXPECTED="MATURITY_$SUFFIX"
          else
            EXPECTED="MATURITY_STABLE"
          fi
          if [ "$SRC_MATURITY" != "$EXPECTED" ]; then
            echo "::error::Release '$SRC_RELEASE' requires $EXPECTED but maturity is $SRC_MATURITY"
            exit 1
          fi

          echo "✓ Version consistency verified"

      - name: Scan built plugin for secrets
        if: steps.check_release.outputs.exists == 'false'
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source /repo/dist --no-git --redact --config /repo/.gitleaks.toml

      - name: Create release zip
        if: steps.check_release.outputs.exists == 'false'
        run: |
          # Copy dist to a folder named 'skilland' for Moodle zip structure
          cp -r dist skilland

          # Create zip
          zip -r mod_skilland-${{ steps.version.outputs.moodle_version }}.zip skilland

          echo "Created mod_skilland-${{ steps.version.outputs.moodle_version }}.zip"
          ls -la ./*.zip

      - name: Smoke test release zip
        if: steps.check_release.outputs.exists == 'false'
        run: |
          ZIPCHECK="$RUNNER_TEMP/zipcheck"
          rm -rf "$ZIPCHECK"
          mkdir -p "$ZIPCHECK"
          unzip -q "mod_skilland-${{ steps.version.outputs.moodle_version }}.zip" -d "$ZIPCHECK"
          cd "$ZIPCHECK"
          FAIL=0

          for f in skilland/version.php skilland/lib.php skilland/vendor/autoload.php \
                   skilland/vendor/firebase/php-jwt/src/JWT.php; do
            if [ ! -f "$f" ]; then
              echo "::error::Release zip is missing $f"
              FAIL=1
            fi
          done

          AMD_BUILT=$(find skilland/amd/build -maxdepth 1 -name '*.min.js' | wc -l)
          AMD_SRC=$(find "$GITHUB_WORKSPACE/src/amd/src" -maxdepth 1 -name '*.js' | wc -l)
          if [ "$AMD_BUILT" -ne "$AMD_SRC" ]; then
            echo "::error::Release zip has $AMD_BUILT amd/build/*.min.js files, expected $AMD_SRC (one per src/amd/src/*.js)"
            FAIL=1
          fi

          FORBIDDEN=$(find skilland \( -name tests -o -name node_modules -o -name .env \
            -o -path 'skilland/vendor/phpunit' -o -path 'skilland/vendor/sebastian' -o -path 'skilland/vendor/bin' \) -print)
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::Release zip contains dev-only paths:"
            echo "$FORBIDDEN"
            FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
          echo "✓ Release zip structure verified ($AMD_BUILT AMD modules)"

      - name: Create git tag
        if: steps.check_release.outputs.exists == 'false' && steps.check_release.outputs.reuse_tag != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE: ${{ steps.version.outputs.release }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $RELEASE"
          git push origin "$TAG"

      - name: Build release notes
        if: steps.check_release.outputs.exists == 'false'
        id: changelog
        run: |
          RELEASE="${{ steps.version.outputs.release }}"
          MOODLEVERSION="${{ steps.version.outputs.moodle_version }}"

          # Pull the section for this version out of CHANGELOG.md, e.g. "## [0.9.35-beta]"
          # up to (not including) the next "## " heading.
          NOTES=$(awk -v ver="$RELEASE" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)

          # Trim leading/trailing blank lines.
          NOTES=$(printf '%s\n' "$NOTES" | sed -e '/./,$!d' -e ':a' -e '/^\n*$/{$d;N;ba' -e '}')

          if [ -n "$NOTES" ]; then
            echo "Found CHANGELOG.md section for $RELEASE"
          else
            echo "No CHANGELOG.md section for $RELEASE, falling back to the default template"
            NOTES=$'### Requirements\n- Moodle 4.2 or later'
          fi

          {
            echo "body<<RELEASE_BODY_EOF"
            echo "## Skilland Moodle Plugin $RELEASE"
            echo
            echo "**Moodle Version:** $MOODLEVERSION"
            echo
            echo "$NOTES"
            echo
            echo "### Installation"
            echo "1. Download \`mod_skilland-$MOODLEVERSION.zip\`"
            echo "2. Extract to your Moodle's \`mod/\` directory"
            echo "3. Visit Site Administration > Notifications to complete installation"
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.release }} (${{ steps.version.outputs.moodle_version }})
          body: ${{ steps.changelog.outputs.body }}
          files: |
            mod_skilland-${{ steps.version.outputs.moodle_version }}.zip
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}


