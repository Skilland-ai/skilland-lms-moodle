name: CI

on:
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only superseded PR runs are cancelled: a push to main must never lose its release gate.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint, PHP syntax & PHPUnit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: PHP syntax check (php -l)
        run: |
          docker run --rm -v "$PWD":/app -w /app php:8.2-cli sh -c \
            'find src cli scripts -name "*.php" -not -path "*/vendor/*" -print0 | xargs -0 -n1 php -l'

      - name: PHPUnit
        run: npm run test:unit

  version:
    name: Version bump & secret scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check version bump in src/version.php
        run: node scripts/check_version.js
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}

      - name: Scan source tree for secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source /repo --no-git --redact --config /repo/.gitleaks.toml
