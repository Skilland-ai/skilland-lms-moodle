name: CI

on:
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  # PR runs share one group per ref and a newer push cancels the older run. Called from
  # release.yml (push to main) the group is unique per run: GitHub drops a *pending* run
  # when a newer one queues in the same group, which would skip a release.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint, PHP syntax & PHPUnit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: AMD build freshness
        run: |
          npm run build
          if ! diff -rq dist/amd/build src/amd/build; then
            echo "::error::Tracked AMD build output in src/amd/build is stale. Run 'npm run build' and copy the changed dist/amd/build/*.min.js files (and any .map) into src/amd/build/, then commit."
            exit 1
          fi

      - name: ESLint
        run: npm run lint

      - name: E2E helper unit tests (Node)
        run: npm run test:e2e:unit

      - name: PHP syntax check (php -l)
        run: |
          docker run --rm -v "$PWD":/app -w /app php:8.2-cli sh -c \
            'find src scripts -name "*.php" -print0 | xargs -0 -n1 php -l'

      - name: PHPUnit
        run: npm run test:unit

      - name: PHPUnit coverage (report only)
        run: |
          mkdir -p coverage
          npm run test:unit:coverage | tee coverage/text.txt
          {
            echo '### PHPUnit coverage'
            echo '```'
            sed -n '/Code Coverage Report/,$p' coverage/text.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phpunit-coverage
          path: coverage/clover.xml
          retention-days: 14
          if-no-files-found: error

      - name: Release archive contents
        run: |
          LEAKED=$(git archive HEAD | tar -t | grep -E '^(00_development|tests|scripts|dist)/|^(composer\.phar|phpunit\.xml)$' || true)
          if [ -n "$LEAKED" ]; then
            echo "::error::git archive contains development-only paths (check .gitattributes):"
            echo "$LEAKED"
            exit 1
          fi

  version:
    name: Version bump & secret scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check version bump in src/version.php
        run: node scripts/check_version.js
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}

      - name: Scan source tree for secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source /repo --no-git --redact --config /repo/.gitleaks.toml
