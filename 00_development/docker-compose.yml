# Moodle Development Environment
# Part of skillandUniverse - can be run standalone or included from parent
#
# Standalone usage: docker compose --profile plugin up -d
# Integrated usage: included from parent skillandUniverse docker-compose.yml
#
# Services:
#   mariadb: 3306 - MariaDB database
#   moodle:  8081 - Moodle LMS with Skilland plugin

services:
  moodle-db:
    image: mariadb:10.11
    profiles: [plugin]
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodle
      MYSQL_PASSWORD: moodlepassword
    volumes:
      - moodle_mariadb_data:/var/lib/mysql
    networks:
      - moodle-network
    restart: unless-stopped

  moodle:
    build:
      context: .
      args:
        MOODLE_TAG: ${MOODLE_TAG:-v4.5.15}
    profiles: [plugin]
    ports:
      - "${MOODLE_PORT:-8081}:80"
    environment:
      MOODLE_WWWROOT: ${MOODLE_WWWROOT:-http://localhost:${MOODLE_PORT:-8081}}
      MOODLE_DB_HOST: moodle-db
      MOODLE_DB_NAME: moodle
      MOODLE_DB_USER: moodle
      MOODLE_DB_PASS: moodlepassword
      MOODLE_ADMIN_USER: admin
      MOODLE_ADMIN_PASS: Admin123!
      MOODLE_ADMIN_EMAIL: admin@localhost.local
      MOODLE_SITE_FULLNAME: "Skilland Moodle Development"
      MOODLE_SITE_SHORTNAME: skilland-dev
      # Skilland wiring read by config.php; MOODLE_SSO_SECRET lives in the monorepo .env
      # (./start.sh --plugin generates it). Empty means the plugin is configured by hand.
      # With SKILLAND_ORG_ID set too, config.php forces that organization id and the SSO secret
      # Skilland derives for it from MOODLE_SSO_SECRET; without it, the SSO secret is typed by hand.
      SKILLAND_SSO_SECRET: ${MOODLE_SSO_SECRET:-}
      SKILLAND_ORG_ID: ${SKILLAND_ORG_ID:-}
      SKILLAND_URL: ${SKILLAND_URL:-}
      SKILLAND_GRAPHQL_ENDPOINT: ${SKILLAND_GRAPHQL_ENDPOINT:-}
      SKILLAND_FRONTEND_URL: ${SKILLAND_FRONTEND_URL:-}
    volumes:
      - moodle_moodledata:/var/moodledata
      # Grunt preserves this directory inode, including during clean builds.
      - ../dist:/var/www/html/mod/skilland:ro
    depends_on:
      - moodle-db
    networks:
      - moodle-network
      - default
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  moodle_mariadb_data:
  moodle_moodledata:

networks:
  moodle-network:
    driver: bridge
